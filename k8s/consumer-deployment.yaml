apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-consumer
  labels:
    app: ml-platform-consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ml-platform-consumer
  template:
    metadata:
      labels:
        app: ml-platform-consumer
    spec:
      containers:
        - name: consumer
          image: sibi-ai/ml-data-platform-kafka:latest
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: brokers
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
